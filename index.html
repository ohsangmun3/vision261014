<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 미니 게임 모음</title>
    <style>
        /* 프리미엄 다크 & 골드 테마 */
        :root {
            --bg-color: #121212;
            --surface-color: #242424;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-light: #f5f5f5;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        
        /* 공통 네비게이션 (메뉴) */
        .nav-bar {
            margin-top: 30px; display: flex; gap: 15px;
            background: var(--surface-color);
            padding: 10px 25px; border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        .nav-btn {
            background: transparent; color: var(--text-light);
            border: 2px solid transparent; padding: 10px 20px;
            border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold;
            text-decoration: none; transition: all 0.3s ease;
            display: inline-block;
        }
        .nav-btn.active {
            background: rgba(212, 175, 55, 0.1); 
            border: 2px solid var(--gold); color: var(--gold);
        }
        .nav-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.05); color: var(--gold-hover); }
        
        /* 게임 화면 컨테이너 */
        .game-section {
            display: none; width: 100%; max-width: 600px;
            background: var(--surface-color); padding: 40px;
            border-radius: 20px; margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9); 
            text-align: center;
            border-top: 4px solid var(--gold);
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out;
        }
        .game-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 가위바위보 전용 스타일 */
        .rps-hands { 
            font-size: 70px; margin: 30px 0; 
            display: flex; justify-content: space-around; 
        }
        .hand { transition: transform 0.3s; }
        .shake { animation: shake 0.6s infinite; }
        @keyframes shake {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-15deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-10px) rotate(15deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .btn-group button {
            background: var(--bg-color); color: var(--gold);
            border: 2px solid var(--gold); font-size: 18px; font-weight: bold;
            padding: 12px 30px; margin: 5px; border-radius: 12px; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-group button:hover { background: var(--gold); color: var(--bg-color); transform: scale(1.05); }
        
        /* 오목 전용 스타일 */
        canvas {
            /* 고급스러운 원목 느낌의 그라데이션 */
            background: radial-gradient(circle, #e6c27a, #c49a45, #8b6914);
            border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            margin-top: 20px; cursor: crosshair;
            border: 2px solid #5a4310;
        }
        .level-select { margin-bottom: 15px; font-size: 16px; color: #ccc; }
        select { 
            background: var(--bg-color); color: var(--gold); 
            border: 1px solid var(--gold); padding: 8px 15px; 
            border-radius: 8px; font-size: 15px; outline: none;
        }
        .new-game-btn {
            background: var(--gold); color: #121212; border: none; 
            padding: 9px 20px; border-radius: 8px; font-weight: bold; 
            cursor: pointer; transition: 0.2s; margin-left: 10px;
        }
        .new-game-btn:hover { background: var(--gold-hover); }
    </style>
</head>
<body>

    <!-- 1. 게임 이동 탭 (갤러그 링크 포함) -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="showGame('rps')">가위바위보</button>
        <button class="nav-btn" onclick="showGame('gomoku')">오목</button>
        <!-- 세 번째 게임으로 이동하는 깃허브 페이지 링크 -->
        <a href="galaga.html" class="nav-btn">🚀 갤러그 (New)</a>
    </div>

    <!-- 2. 프리미엄 가위바위보 게임 -->
    <div id="rps" class="game-section active">
        <h2 style="color: var(--gold); margin-top: 0;">가위바위보 (3판 2선승)</h2>
        <h3 id="score-board" style="font-size: 24px; letter-spacing: 2px;">나 0 : 0 컴퓨터</h3>
        
        <!-- 손 애니메이션 영역 -->
        <div class="rps-hands">
            <div id="user-hand" class="hand">🤜</div>
            <div id="comp-hand" class="hand">🤛</div>
        </div>
        
        <p id="rps-result" style="height: 24px; font-weight: bold; color: var(--gold); font-size: 18px;"></p>
        
        <!-- 버튼 영역 -->
        <div class="btn-group">
            <button onclick="playRps('가위')">✌️ 가위</button>
            <button onclick="playRps('바위')">✊ 바위</button>
            <button onclick="playRps('보')">🖐️ 보</button>
        </div>
    </div>

    <!-- 3. 프리미엄 오목 게임 -->
    <div id="gomoku" class="game-section">
        <h2 style="color: var(--gold); margin-top: 0;">오목 (AI 대전)</h2>
        <div class="level-select">
            컴퓨터 난이도: 
            <select id="gomoku-level">
                <option value="1">초급 (랜덤)</option>
                <option value="2" selected>중급 (방어)</option>
                <option value="3">고급 (공수겸장)</option>
            </select>
            <button class="new-game-btn" onclick="startGomoku()">새 게임 시작</button>
        </div>
        <p id="gomoku-msg" style="height: 20px; color: var(--gold); font-weight: bold;">당신(흑돌)의 차례입니다.</p>
        
        <!-- 오목판 캔버스 -->
        <canvas id="board" width="450" height="450"></canvas>
    </div>

    <script>
        // --- 탭 이동 로직 ---
        function showGame(gameId) {
            document.querySelectorAll('.game-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('button.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(gameId).classList.add('active');
            event.target.classList.add('active');
        }

        // --- 가위바위보 로직 ---
        const emojis = { '가위': '✌️', '바위': '✊', '보': '🖐️' };
        let uScore = 0, cScore = 0, isPlaying = false;

        function playRps(userChoice) {
            if (isPlaying || uScore >= 2 || cScore >= 2) return;
            isPlaying = true;
            
            const uHand = document.getElementById('user-hand');
            const cHand = document.getElementById('comp-hand');
            const resultText = document.getElementById('rps-result');
            
            // 준비 모션
            uHand.innerText = '🤜'; cHand.innerText = '🤛';
            uHand.classList.add('shake'); cHand.classList.add('shake');
            resultText.innerText = "가위... 바위... 보!";
            resultText.style.color = "#ccc";

            // 1.2초 뒤 결과 발표
            setTimeout(() => {
                uHand.classList.remove('shake'); cHand.classList.remove('shake');
                
                const choices = ['가위', '바위', '보'];
                const compChoice = choices[Math.floor(Math.random() * 3)];
                
                uHand.innerText = emojis[userChoice];
                cHand.innerText = emojis[compChoice];

                if (userChoice === compChoice) {
                    resultText.innerText = "비겼습니다!";
                    resultText.style.color = "#fff";
                } else if (
                    (userChoice === '가위' && compChoice === '보') || 
                    (userChoice === '바위' && compChoice === '가위') || 
                    (userChoice === '보' && compChoice === '바위')
                ) {
                    resultText.innerText = "이겼습니다! (+1점)";
                    resultText.style.color = "#00ff88";
                    uScore++;
                } else {
                    resultText.innerText = "졌습니다! (컴퓨터 +1점)";
                    resultText.style.color = "#ff4444";
                    cScore++;
                }
                
                document.getElementById('score-board').innerText = `나 ${uScore} : ${cScore} 컴퓨터`;
                
                // 최종 승패 확인
                setTimeout(() => {
                    if (uScore >= 2) {
                        resultText.innerText = "🎉 축하합니다! 최종 승리하셨습니다! 🎉";
                        resultText.style.color = "var(--gold)";
                    } else if (cScore >= 2) {
                        resultText.innerText = "💻 컴퓨터가 최종 승리했습니다. 💻";
                        resultText.style.color = "#ff4444";
                    }
                    isPlaying = false;
                }, 500);

            }, 1200);
        }

        // --- 오목 로직 ---
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const size = 15; 
        const cellSize = 30;
        let board = [], isGameOver = false;

        function startGomoku() {
            board = Array(size).fill().map(() => Array(size).fill(0));
            isGameOver = false;
            document.getElementById('gomoku-msg').innerText = "당신(흑돌)의 차례입니다.";
            document.getElementById('gomoku-msg').style.color = "var(--gold)";
            drawBoard();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(0, 0, 0, 0.7)"; 
            ctx.lineWidth = 1;
            
            // 격자 그리기
            for (let i = 0; i < size; i++) {
                ctx.beginPath(); ctx.moveTo(15 + i * cellSize, 15); ctx.lineTo(15 + i * cellSize, canvas.height - 15); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(15, 15 + i * cellSize); ctx.lineTo(canvas.width - 15, 15 + i * cellSize); ctx.stroke();
            }
            
            // 돌 그리기 (3D 효과 적용)
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (board[y][x] === 1) drawStone(x, y, true);  // 흑돌 (플레이어)
                    if (board[y][x] === 2) drawStone(x, y, false); // 백돌 (컴퓨터)
                }
            }
        }

        // 3D 입체 돌 그리기 함수
        function drawStone(x, y, isBlack) {
            const cx = 15 + x * cellSize; 
            const cy = 15 + y * cellSize;
            
            // 그림자
            ctx.beginPath();
            ctx.arc(cx + 2, cy + 2, 13, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.fill();

            // 본체
            ctx.beginPath(); 
            ctx.arc(cx, cy, 13, 0, Math.PI * 2);
            
            // 빛 반사 그라데이션
            const grd = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 13);
            if (isBlack) { 
                grd.addColorStop(0, "#555"); 
                grd.addColorStop(1, "#0a0a0a"); 
            } else { 
                grd.addColorStop(0, "#fff"); 
                grd.addColorStop(1, "#d1d1d1"); 
            }
            ctx.fillStyle = grd; 
            ctx.fill();
        }

        // 오목 클릭 이벤트
        canvas.addEventListener('click', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = Math.round((e.clientX - rect.left - 15) / cellSize);
            const y = Math.round((e.clientY - rect.top - 15) / cellSize);
            
            if (x >= 0 && x < size && y >= 0 && y < size && board[y][x] === 0) {
                board[y][x] = 1; 
                drawBoard();
                
                if (checkWin(x, y, 1)) { 
                    document.getElementById('gomoku-msg').innerText = "🎉 축하합니다! 당신(흑돌)의 승리입니다!"; 
                    isGameOver = true; 
                    return; 
                }
                
                document.getElementById('gomoku-msg').innerText = "컴퓨터가 생각 중입니다...";
                document.getElementById('gomoku-msg').style.color = "#ccc";
                
                setTimeout(computerMove, 600);
            }
        });

        // 컴퓨터 AI 로직 (간단화)
        function computerMove() {
            let emptySpots = [];
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    if (board[y][x] === 0) emptySpots.push({x, y});
                }
            }
            if (emptySpots.length > 0) {
                // 현재는 무작위(초급) 배치. (실제 서비스시 난이도 로직 추가)
                let move = emptySpots[Math.floor(Math.random() * emptySpots.length)];
                board[move.y][move.x] = 2; 
                drawBoard();
                
                if (checkWin(move.x, move.y, 2)) { 
                    document.getElementById('gomoku-msg').innerText = "💻 컴퓨터(백돌)의 승리입니다!"; 
                    document.getElementById('gomoku-msg').style.color = "#ff4444";
                    isGameOver = true; 
                } else { 
                    document.getElementById('gomoku-msg').innerText = "당신(흑돌)의 차례입니다."; 
                    document.getElementById('gomoku-msg').style.color = "var(--gold)";
                }
            }
        }

        // 승리 판정 (5목 확인)
        function checkWin(cx, cy, player) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dx, dy] of directions) {
                let count = 1;
                for (let i = 1; i <= 4; i++) {
                    let nx = cx + dx * i, ny = cy + dy * i;
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size && board[ny][nx] === player) count++; else break;
                }
                for (let i = 1; i <= 4; i++) {
                    let nx = cx - dx * i, ny = cy - dy * i;
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size && board[ny][nx] === player) count++; else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        // 페이지 로드 시 오목판 초기화
        startGomoku();
    </script>
</body>
</html>
