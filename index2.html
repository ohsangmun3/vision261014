<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 미니 게임 모음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0a0a0a;
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0a 70%);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }

        /* 프리미엄 골드 텍스트 효과 */
        .text-gold {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }

        .gold-border {
            border: 1px solid #bf953f;
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.2);
        }

        .gold-border:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(191, 149, 63, 0.5);
        }

        /* 탭 스타일 */
        .tab-btn {
            position: relative;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: #fcf6ba;
            font-weight: 600;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #bf953f);
            box-shadow: 0 0 10px rgba(252, 246, 186, 0.8);
        }

        /* 가위바위보 아이콘 및 애니메이션 */
        .hand-icon {
            font-size: 6rem;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.8));
            transition: all 0.2s ease;
            line-height: 1;
        }
        @media (min-width: 768px) { .hand-icon { font-size: 8rem; } }

        .flip-horizontal { transform: scaleX(-1); }

        @keyframes shakePlayer {
            0%, 50%, 100% { transform: scaleX(-1) translateY(0) rotate(0deg); }
            25% { transform: scaleX(-1) translateY(-30px) rotate(-10deg); }
            75% { transform: scaleX(-1) translateY(30px) rotate(10deg); }
        }

        @keyframes shakeComputer {
            0%, 50%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(10deg); }
            75% { transform: translateY(30px) rotate(-10deg); }
        }

        .animate-shake-player { animation: shakePlayer 0.5s infinite; }
        .animate-shake-computer { animation: shakeComputer 0.5s infinite; }

        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-glow { transition: all 0.3s ease; }
        .btn-glow:not(:disabled):hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(191, 149, 63, 0.4);
            border-color: #fcf6ba;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        /* 오목 캔버스 컨테이너 */
        #gomoku-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            position: relative;
            background: linear-gradient(135deg, #1e1e1e 0%, #0a0a0a 100%);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
        }
        
        #gomoku-canvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            background-color: rgba(20, 20, 20, 0.8); /* 약간 투명한 다크 우드 느낌 대체 */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair;
        }

        /* 드롭다운 스타일링 */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bf953f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <div class="w-full max-w-5xl flex flex-col items-center">
        
        <!-- Header & Tabs -->
        <div class="text-center mb-6 w-full fade-in">
            <h1 class="text-3xl md:text-5xl font-cinzel font-bold text-gold mb-6 tracking-wider pt-4">ROYAL ARCADE</h1>
            
            <div class="flex justify-center gap-8 border-b border-gray-800 pb-2">
                <button onclick="switchTab('rps')" id="tab-rps" class="tab-btn active text-gray-400 text-lg md:text-xl font-cinzel tracking-widest pb-2 focus:outline-none">R.P.S</button>
                <button onclick="switchTab('gomoku')" id="tab-gomoku" class="tab-btn text-gray-400 text-lg md:text-xl font-cinzel tracking-widest pb-2 focus:outline-none">GOMOKU</button>
            </div>
        </div>

        <!-- ==================== TAB 1: 가위바위보 ==================== -->
        <div id="view-rps" class="w-full flex flex-col items-center fade-in">
            <!-- Score Board -->
            <div class="flex justify-between items-center w-full max-w-2xl bg-black/40 backdrop-blur-md rounded-2xl p-6 gold-border mb-12">
                <div class="text-center flex-1">
                    <p class="text-gray-400 text-sm tracking-widest mb-2 uppercase">Player</p>
                    <p id="rps-player-score" class="text-5xl md:text-6xl font-cinzel text-gold font-bold transition-all duration-300">0</p>
                </div>
                <div class="text-center flex-1">
                    <span class="text-xl md:text-2xl text-gray-600 font-cinzel px-4 py-2 rounded-full border border-gray-800 bg-gray-900/50">VS</span>
                </div>
                <div class="text-center flex-1">
                    <p class="text-gray-400 text-sm tracking-widest mb-2 uppercase">Computer</p>
                    <p id="rps-computer-score" class="text-5xl md:text-6xl font-cinzel text-gold font-bold transition-all duration-300">0</p>
                </div>
            </div>

            <!-- Battle Arena -->
            <div class="relative w-full max-w-3xl flex justify-between items-center mb-16 h-32 md:h-64">
                <div class="w-1/3 flex justify-center z-10">
                    <div id="rps-player-hand" class="hand-icon flip-horizontal">✊</div>
                </div>
                <div class="w-1/3 flex justify-center items-center z-20 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
                    <div id="rps-status-text" class="text-6xl md:text-8xl font-cinzel font-bold text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.5)] transition-all duration-300"></div>
                </div>
                <div class="w-1/3 flex justify-center z-10">
                    <div id="rps-computer-hand" class="hand-icon">✊</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-wrap justify-center gap-4 md:gap-8 w-full max-w-2xl">
                <button onclick="playRPS('rock')" class="rps-btn btn-glow bg-black/60 gold-border rounded-xl px-6 py-4 flex flex-col items-center min-w-[100px] md:min-w-[120px]">
                    <span class="text-3xl md:text-4xl mb-2">✊</span>
                    <span class="text-gray-300 text-xs md:text-sm tracking-widest uppercase font-semibold">Rock</span>
                </button>
                <button onclick="playRPS('paper')" class="rps-btn btn-glow bg-black/60 gold-border rounded-xl px-6 py-4 flex flex-col items-center min-w-[100px] md:min-w-[120px]">
                    <span class="text-3xl md:text-4xl mb-2">✋</span>
                    <span class="text-gray-300 text-xs md:text-sm tracking-widest uppercase font-semibold">Paper</span>
                </button>
                <button onclick="playRPS('scissors')" class="rps-btn btn-glow bg-black/60 gold-border rounded-xl px-6 py-4 flex flex-col items-center min-w-[100px] md:min-w-[120px]">
                    <span class="text-3xl md:text-4xl mb-2">✌️</span>
                    <span class="text-gray-300 text-xs md:text-sm tracking-widest uppercase font-semibold">Scissors</span>
                </button>
            </div>
            <p id="rps-round-result" class="mt-8 text-lg md:text-xl text-gray-400 font-light h-8 text-center transition-all duration-300"></p>
        </div>

        <!-- ==================== TAB 2: 오목 ==================== -->
        <div id="view-gomoku" class="w-full flex flex-col items-center hidden fade-in">
            
            <div class="w-full max-w-lg flex justify-between items-center mb-4 px-2">
                <!-- 난이도 선택 -->
                <div class="relative">
                    <select id="gomoku-difficulty" onchange="restartGomoku()" class="bg-black/60 gold-border text-[#bf953f] text-sm md:text-base font-cinzel rounded-lg px-4 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-[#fcf6ba]">
                        <option value="easy">Easy (하수)</option>
                        <option value="medium">Medium (중수)</option>
                        <option value="hard" selected>Hard (고수)</option>
                    </select>
                </div>
                
                <!-- 재시작 버튼 -->
                <button onclick="restartGomoku()" class="bg-transparent border border-gray-600 text-gray-300 hover:text-[#bf953f] hover:border-[#bf953f] px-4 py-2 rounded-lg text-sm uppercase tracking-widest transition-colors">
                    Restart
                </button>
            </div>

            <!-- 상태 표시 -->
            <div id="gomoku-status" class="text-xl md:text-2xl font-cinzel text-gold mb-4 h-8 flex items-center justify-center">
                Your Turn (Black)
            </div>

            <!-- 오목판 캔버스 -->
            <div id="gomoku-container" class="gold-border shadow-[0_10px_30px_rgba(0,0,0,0.8)]">
                <canvas id="gomoku-canvas"></canvas>
            </div>
            
            <p class="mt-6 text-gray-500 text-sm text-center">
                플레이어는 흑돌(먼저 시작)이며, 5개의 돌을 연속으로 놓으면 승리합니다.
            </p>
        </div>

    </div>

    <!-- Game Over Modal (공용) -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-500">
        <div class="bg-gray-900 border border-[#bf953f] p-10 md:p-16 rounded-2xl shadow-[0_0_50px_rgba(191,149,63,0.3)] text-center max-w-lg w-full mx-4 transform scale-95 transition-transform duration-500" id="modal-content">
            <h2 class="text-4xl md:text-5xl font-cinzel font-bold text-gold mb-4" id="modal-title">VICTORY</h2>
            <p class="text-gray-300 mb-10 text-lg" id="modal-desc">You have claimed the throne.</p>
            
            <button onclick="closeModalAndReset()" class="bg-gradient-to-r from-[#bf953f] to-[#aa771c] hover:from-[#fcf6ba] hover:to-[#bf953f] text-black font-bold uppercase tracking-widest py-4 px-10 rounded-full transition-all duration-300 shadow-[0_0_20px_rgba(191,149,63,0.4)] hover:shadow-[0_0_30px_rgba(252,246,186,0.6)] transform hover:-translate-y-1">
                Play Again
            </button>
        </div>
    </div>

    <script>
        // --- 탭 전환 로직 ---
        let currentTab = 'rps';
        function switchTab(tabId) {
            if (currentTab === tabId) return;
            
            document.getElementById('tab-rps').classList.remove('active');
            document.getElementById('tab-gomoku').classList.remove('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');

            document.getElementById('view-rps').classList.add('hidden');
            document.getElementById('view-gomoku').classList.add('hidden');
            
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            currentTab = tabId;

            // 오목 탭으로 전환시 캔버스 리사이징 처리
            if(tabId === 'gomoku') {
                resizeCanvas();
                drawBoard();
            }
        }

        // 공통 유틸리티
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        
        // 모달 제어
        let lastGamePlayed = ''; // 'rps' or 'gomoku'
        const modal = document.getElementById('game-over-modal');
        const modalContent = document.getElementById('modal-content');
        
        function showModal(title, desc, isWin, game) {
            lastGamePlayed = game;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-title').className = `text-4xl md:text-5xl font-cinzel font-bold mb-4 ${isWin ? 'text-[#bf953f]' : 'text-red-500'}`;
            document.getElementById('modal-desc').textContent = desc;

            modal.classList.remove('hidden');
            void modal.offsetWidth; // trigger reflow
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeModalAndReset() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                if (lastGamePlayed === 'rps') resetRPS();
                if (lastGamePlayed === 'gomoku') restartGomoku();
            }, 500);
        }

        // ==================== 가위바위보(RPS) 로직 ====================
        let rpsPlayerScore = 0;
        let rpsComputerScore = 0;
        let rpsIsPlaying = false;
        const rpsEmojis = { 'rock': '✊', 'paper': '✋', 'scissors': '✌️' };
        const rpsChoices = ['rock', 'paper', 'scissors'];

        async function playRPS(playerChoice) {
            if (rpsIsPlaying) return;
            rpsIsPlaying = true;

            const pHand = document.getElementById('rps-player-hand');
            const cHand = document.getElementById('rps-computer-hand');
            const statusText = document.getElementById('rps-status-text');
            const resultText = document.getElementById('rps-round-result');
            const btns = document.querySelectorAll('.rps-btn');

            resultText.textContent = "";
            btns.forEach(b => b.disabled = true);
            
            pHand.textContent = rpsEmojis['rock'];
            cHand.textContent = rpsEmojis['rock'];
            pHand.classList.add('animate-shake-player');
            cHand.classList.add('animate-shake-computer');

            // 카운트다운
            for (let i = 3; i > 0; i--) {
                statusText.textContent = i;
                statusText.style.transform = "scale(1.5)";
                statusText.style.opacity = "1";
                await sleep(100);
                statusText.style.transform = "scale(1)";
                await sleep(900);
            }

            pHand.classList.remove('animate-shake-player');
            cHand.classList.remove('animate-shake-computer');
            statusText.style.opacity = "0";
            await sleep(100);
            statusText.textContent = "";

            const computerChoice = rpsChoices[Math.floor(Math.random() * 3)];
            pHand.textContent = rpsEmojis[playerChoice];
            cHand.textContent = rpsEmojis[computerChoice];

            await sleep(300);

            // 승패 판정
            let result = "";
            if (playerChoice === computerChoice) {
                resultText.textContent = "Draw!";
                resultText.className = "mt-8 text-lg md:text-xl text-gray-400 font-light h-8 text-center";
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = "WIN";
                rpsPlayerScore++;
                document.getElementById('rps-player-score').textContent = rpsPlayerScore;
                resultText.textContent = "You win the round!";
                resultText.className = "mt-8 text-lg md:text-xl text-[#bf953f] font-semibold h-8 text-center";
            } else {
                result = "LOSE";
                rpsComputerScore++;
                document.getElementById('rps-computer-score').textContent = rpsComputerScore;
                resultText.textContent = "Computer wins the round.";
                resultText.className = "mt-8 text-lg md:text-xl text-red-400 font-semibold h-8 text-center";
            }

            // Flash Status
            if(result) {
                statusText.textContent = result;
                statusText.style.opacity = "1";
                statusText.style.transform = "scale(1.2)";
                statusText.style.color = result === "WIN" ? "#bf953f" : "#ef4444";
                await sleep(1000);
                statusText.style.opacity = "0";
                await sleep(300);
                statusText.style.color = "#ffffff";
            }

            // 게임 종료 체크 (2선승)
            if (rpsPlayerScore >= 2 || rpsComputerScore >= 2) {
                showModal(
                    rpsPlayerScore >= 2 ? "VICTORY" : "DEFEAT",
                    rpsPlayerScore >= 2 ? "You have claimed the throne with 2 points." : "The computer outsmarted you this time.",
                    rpsPlayerScore >= 2,
                    'rps'
                );
            } else {
                btns.forEach(b => b.disabled = false);
                rpsIsPlaying = false;
            }
        }

        function resetRPS() {
            rpsPlayerScore = 0; rpsComputerScore = 0;
            document.getElementById('rps-player-score').textContent = '0';
            document.getElementById('rps-computer-score').textContent = '0';
            document.getElementById('rps-round-result').textContent = "";
            document.getElementById('rps-player-hand').textContent = rpsEmojis['rock'];
            document.getElementById('rps-computer-hand').textContent = rpsEmojis['rock'];
            document.querySelectorAll('.rps-btn').forEach(b => b.disabled = false);
            rpsIsPlaying = false;
        }

        // ==================== 오목(GOMOKU) 로직 ====================
        const canvas = document.getElementById('gomoku-canvas');
        const ctx = canvas.getContext('2d');
        const gomokuStatus = document.getElementById('gomoku-status');
        
        const BOARD_SIZE = 15;
        let board = []; // 0: empty, 1: black(player), 2: white(computer)
        let cellSize = 0;
        let isPlayerTurn = true;
        let isGomokuGameOver = false;

        // 보드 초기화
        function initBoard() {
            board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        }

        // 캔버스 크기 조정 (반응형)
        function resizeCanvas() {
            const container = document.getElementById('gomoku-container');
            // 고해상도 디스플레이 대응
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            
            // 내부 패딩을 고려한 실제 그리기 영역
            const padding = 10;
            const size = rect.width - (padding * 2);
            
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            
            ctx.scale(dpr, dpr);
            
            // CSS 스타일 크기
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            
            cellSize = size / BOARD_SIZE;
        }

        // 보드 및 돌 그리기
        function drawBoard() {
            // 배경 지우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 격자 그리기
            ctx.strokeStyle = 'rgba(191, 149, 63, 0.4)'; // Gold-ish lines
            ctx.lineWidth = 1;
            
            for (let i = 0; i < BOARD_SIZE; i++) {
                // 가로줄
                ctx.beginPath();
                ctx.moveTo(cellSize / 2, cellSize / 2 + i * cellSize);
                ctx.lineTo(canvas.width/window.devicePixelRatio - cellSize / 2, cellSize / 2 + i * cellSize);
                ctx.stroke();
                
                // 세로줄
                ctx.beginPath();
                ctx.moveTo(cellSize / 2 + i * cellSize, cellSize / 2);
                ctx.lineTo(cellSize / 2 + i * cellSize, canvas.height/window.devicePixelRatio - cellSize / 2);
                ctx.stroke();
            }

            // 점 찍기 (화점)
            const dots = [3, 7, 11];
            ctx.fillStyle = 'rgba(191, 149, 63, 0.8)';
            for(let i of dots) {
                for(let j of dots) {
                    ctx.beginPath();
                    ctx.arc(cellSize / 2 + i * cellSize, cellSize / 2 + j * cellSize, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 돌 그리기
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] !== 0) {
                        drawPiece(r, c, board[r][c]);
                    }
                }
            }
        }

        function drawPiece(r, c, player) {
            const x = cellSize / 2 + c * cellSize;
            const y = cellSize / 2 + r * cellSize;
            const radius = cellSize * 0.4;

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            
            if (player === 1) { // 흑돌 (Player)
                ctx.fillStyle = '#111';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
            } else { // 백돌 (Computer)
                ctx.fillStyle = '#eee';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
            }
            
            ctx.fill();
            
            // 약간의 입체감 (그라데이션 효과 흉내)
            ctx.shadowColor = 'transparent';
            ctx.beginPath();
            ctx.arc(x - radius*0.3, y - radius*0.3, radius*0.3, 0, Math.PI * 2);
            ctx.fillStyle = player === 1 ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.8)';
            ctx.fill();
        }

        // 마우스 클릭 이벤트
        canvas.addEventListener('click', (e) => {
            if (!isPlayerTurn || isGomokuGameOver) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const c = Math.floor(x / cellSize);
            const r = Math.floor(y / cellSize);

            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === 0) {
                placePiece(r, c, 1); // 1 is Player
            }
        });

        async function placePiece(r, c, player) {
            board[r][c] = player;
            drawBoard();

            if (checkWin(r, c, player)) {
                isGomokuGameOver = true;
                setTimeout(() => {
                    showModal(
                        player === 1 ? "GOMOKU WIN" : "GOMOKU LOSE",
                        player === 1 ? "You defeated the AI." : "The AI has bested you.",
                        player === 1,
                        'gomoku'
                    );
                }, 500);
                return;
            }

            // 보드 꽉 찼는지 확인
            if (board.flat().every(cell => cell !== 0)) {
                isGomokuGameOver = true;
                setTimeout(() => showModal("DRAW", "The board is full.", true, 'gomoku'), 500);
                return;
            }

            if (player === 1) {
                isPlayerTurn = false;
                gomokuStatus.textContent = "Computer is thinking...";
                gomokuStatus.className = "text-xl md:text-2xl font-cinzel text-gray-400 mb-4 h-8 flex items-center justify-center animate-pulse";
                
                await sleep(500); // 딜레이를 주어 생각하는 듯한 효과
                computerMove();
            } else {
                isPlayerTurn = true;
                gomokuStatus.textContent = "Your Turn (Black)";
                gomokuStatus.className = "text-xl md:text-2xl font-cinzel text-gold mb-4 h-8 flex items-center justify-center";
            }
        }

        // 승리 판정 (가장 최근에 둔 돌을 기준으로 8방향 탐색)
        function checkWin(r, c, player) {
            const dirs = [
                [1, 0], [0, 1], [1, 1], [1, -1] // 세로, 가로, 우하대각, 우상대각
            ];

            for (let [dr, dc] of dirs) {
                let count = 1; // 방금 둔 돌 포함
                
                // 정방향
                for (let i = 1; i < 5; i++) {
                    const nr = r + dr * i;
                    const nc = c + dc * i;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || board[nr][nc] !== player) break;
                    count++;
                }
                
                // 역방향
                for (let i = 1; i < 5; i++) {
                    const nr = r - dr * i;
                    const nc = c - dc * i;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || board[nr][nc] !== player) break;
                    count++;
                }

                if (count >= 5) return true;
            }
            return false;
        }

        // AI 로직
        function computerMove() {
            const diff = document.getElementById('gomoku-difficulty').value;
            let move = null;

            if (diff === 'easy') {
                move = getRandomMove();
            } else if (diff === 'medium') {
                move = getMediumMove();
            } else {
                move = getHardMove();
            }

            if (move) {
                placePiece(move.r, move.c, 2); // 2 is Computer
            }
        }

        function getEmptyCells() {
            const empty = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === 0) empty.push({r, c});
                }
            }
            return empty;
        }

        function getRandomMove() {
            const empty = getEmptyCells();
            if (empty.length === 0) return null;
            return empty[Math.floor(Math.random() * empty.length)];
        }

        // Medium: 자신이 당장 이기거나(5목 완성), 상대가 당장 이기는 것(4목)을 막는다. 그 외엔 랜덤.
        function getMediumMove() {
            const empty = getEmptyCells();
            
            // 1. 내가 이길 수 있는 곳 찾기
            for (let cell of empty) {
                board[cell.r][cell.c] = 2; // 가상으로 두어봄
                if (checkWin(cell.r, cell.c, 2)) {
                    board[cell.r][cell.c] = 0; // 원복
                    return cell;
                }
                board[cell.r][cell.c] = 0;
            }

            // 2. 상대가 이길 수 있는 곳 막기
            for (let cell of empty) {
                board[cell.r][cell.c] = 1; // 상대가 둔다고 가정
                if (checkWin(cell.r, cell.c, 1)) {
                    board[cell.r][cell.c] = 0;
                    return cell;
                }
                board[cell.r][cell.c] = 0;
            }

            // 3. 해당 없으면 랜덤
            return getRandomMove();
        }

        // Hard: 휴리스틱 평가 함수 (각 빈칸의 가치를 평가)
        function getHardMove() {
            const empty = getEmptyCells();
            let bestScore = -Infinity;
            let bestMoves = [];

            // 보드에 돌이 하나도 없으면 중앙에 둠 (첫 수 방어 또는 랜덤)
            if (empty.length === BOARD_SIZE * BOARD_SIZE) {
                return { r: 7, c: 7 };
            }
            // 보드에 돌이 하나만 있으면 중앙 근처에 둠
            if (empty.length === BOARD_SIZE * BOARD_SIZE - 1) {
                for(let r=6; r<=8; r++) {
                    for(let c=6; c<=8; c++) {
                        if(board[r][c] === 0) return {r, c};
                    }
                }
            }

            for (let cell of empty) {
                let score = 0;
                
                // 공격 점수 (컴퓨터가 두었을 때의 패턴 가치)
                score += evaluatePosition(cell.r, cell.c, 2);
                
                // 방어 점수 (플레이어가 두었을 때의 패턴 가치를 기반으로 방어)
                // 방어에 살짝 더 높은 가중치를 주어 치명적인 공격을 잘 막도록 함
                score += evaluatePosition(cell.r, cell.c, 1) * 1.2;

                // 약간의 난수를 더해 매번 똑같은 패턴으로 게임이 진행되는 것을 방지
                score += Math.random(); 

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [cell];
                } else if (score === bestScore) {
                    bestMoves.push(cell);
                }
            }

            // 최고 점수가 여러 개면 랜덤 선택
            return bestMoves[Math.floor(Math.random() * bestMoves.length)];
        }

        // 특정 위치에 특정 플레이어가 두었을 때 만들어지는 패턴(연속된 돌)을 기반으로 점수 계산
        function evaluatePosition(r, c, player) {
            let score = 0;
            const dirs = [ [1, 0], [0, 1], [1, 1], [1, -1] ];

            for (let [dr, dc] of dirs) {
                let consecutive = 1;
                let block = 0; // 양쪽 막힘 여부 (0: 열림, 1: 한쪽막힘, 2: 양쪽막힘)
                
                // 정방향 탐색
                let i = 1;
                while (true) {
                    const nr = r + dr * i;
                    const nc = c + dc * i;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) {
                        block++;
                        break;
                    }
                    if (board[nr][nc] === player) {
                        consecutive++;
                        i++;
                    } else if (board[nr][nc] !== 0) { // 상대 돌
                        block++;
                        break;
                    } else { // 빈 칸
                        break;
                    }
                }

                // 역방향 탐색
                i = 1;
                while (true) {
                    const nr = r - dr * i;
                    const nc = c - dc * i;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) {
                        block++;
                        break;
                    }
                    if (board[nr][nc] === player) {
                        consecutive++;
                        i++;
                    } else if (board[nr][nc] !== 0) { // 상대 돌
                        block++;
                        break;
                    } else { // 빈 칸
                        break;
                    }
                }

                // 점수 부여 기준 (휴리스틱)
                if (consecutive >= 5) {
                    score += 100000; // 승리 확정
                } else if (consecutive === 4) {
                    if (block === 0) score += 10000; // 열린 4 (필승)
                    else if (block === 1) score += 1000; // 닫힌 4 (상대가 막아야 함)
                } else if (consecutive === 3) {
                    if (block === 0) score += 1000; // 열린 3
                    else if (block === 1) score += 100; // 닫힌 3
                } else if (consecutive === 2) {
                    if (block === 0) score += 100;
                    else if (block === 1) score += 10;
                } else {
                    score += 1;
                }
            }
            return score;
        }

        // 오목 재시작
        function restartGomoku() {
            initBoard();
            isPlayerTurn = true;
            isGomokuGameOver = false;
            gomokuStatus.textContent = "Your Turn (Black)";
            gomokuStatus.className = "text-xl md:text-2xl font-cinzel text-gold mb-4 h-8 flex items-center justify-center";
            drawBoard();
        }

        // 초기화 실행
        window.addEventListener('resize', () => {
            if(currentTab === 'gomoku') {
                resizeCanvas();
                drawBoard();
            }
        });
        
        // 페이지 로드 시 오목판 초기화 해두기
        initBoard();
    </script>
